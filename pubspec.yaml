name: helixpeek
description: "Molecular biology and DNA sequence analysis, built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  go_router: ^17.5.0
  dio: ^5.11.1
  json_annotation: ^4.12.0
  flutter_dotenv: ^6.0.1
  flutter_scene: ^0.23.0
  vector_math: ^2.4.2
  hooks: ^2.2.0
  lottie: ^3.5.1
  url_launcher: ^6.3.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  json_serializable: ^6.14.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  image: ^4.9.2
flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/branding/helix_peek_mark.png
    # Catalog records, tracks and ClinVar snapshots, named by directory.
    #
    # All four track families are absent on purpose. `assets/constraint/`,
    # `assets/impact/` and `assets/clinvar/` are fetched from Supabase Storage
    # and cached on disk by `TrackClient`; the folds are fetched the same way as
    # the `.fsceneb` containers the bake compiled, which is why
    # `flutter_scene_generated/` has gone with them and `hook/build.dart` no
    # longer writes it. The files all stay in the repo — the catalog tests read
    # them off it, and the backend's `pipeline/upload_tracks.py` uploads them — they
    # just do not ship. ClinVar alone was 23.5 MB of the 41.9 this bundle used
    # to carry, and 9.5 MB of that was dystrophin.
    - assets/mock/
    - assets/impact_explanations/
    - assets/animations/process.json

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
