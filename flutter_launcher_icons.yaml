# Regenerate all assets: dart run tool/branding/generate.dart
# That script invokes this configuration and writes platform-specific variants.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: design/branding/generated/app_icon.png
  remove_alpha_ios: true
  background_color_ios: "#0E1116"
  adaptive_icon_background: "#0E1116"
  adaptive_icon_foreground: design/branding/generated/adaptive_foreground.png
  adaptive_icon_monochrome: design/branding/generated/adaptive_monochrome.png
  # The source already has Android's safe-zone padding.
  adaptive_icon_foreground_inset: 0
  web:
    generate: true
    image_path: design/branding/generated/app_icon.png
    background_color: "#0E1116"
    theme_color: "#0E1116"
  windows:
    generate: true
    image_path: design/branding/generated/desktop_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: design/branding/generated/desktop_icon.png
